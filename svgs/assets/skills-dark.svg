<svg xmlns="http://www.w3.org/2000/svg" width="850" height="266" viewBox="0 0 850 266" fill="none">
  <defs>
    <linearGradient id="skills-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#140609"/>
    </linearGradient>

    <filter id="skills-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600&amp;family=Inter:wght@700;800&amp;display=swap');
    
    .skills-header {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 800;
      fill: #F7F7F7;
      letter-spacing: 1px;
    }

    .skill-pill {
      transition: all 0.3s ease;
    }

    .skill-pill text {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #F7F7F7;
    }

    .dot { fill: #ff003c; }
  </style>

  <rect width="850" height="266" rx="16" fill="url(#skills-bg)" stroke="#262626" stroke-width="1.5"/>

  <g transform="translate(30, 35)">
    <circle cx="6" cy="-4" r="5" fill="#ff003c" filter="url(#skills-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="0" class="skills-header">SECURITY TOOLKIT &amp; CORE SKILLS</text>
    <line x1="0" y1="15" x2="790" y2="15" stroke="#262626" stroke-width="1"/>
  </g>
  <g transform="translate(97, 75)">
    <g class="skill-pill" transform="translate(0, 0)">
      <rect width="182" height="32" rx="16" fill="#161616" stroke="#262626" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" class="dot"/>
      <text x="28" y="20">VAPT &amp; Pen Testing</text>
    </g>
    <g class="skill-pill" transform="translate(194, 0)">
      <rect width="174" height="32" rx="16" fill="#161616" stroke="#262626" stroke-width="1.2"/>
      <circle cx="16" cy="16" r="4" class="dot"/>
      <text x="28" y="20">Python Automation</text>
