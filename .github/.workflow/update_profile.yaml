name: Update Profile SVGs

on:
  schedule:
    # GitHub Actions supports a minimum interval of 5 minutes (*/5 * * * *)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Generate updated SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build_all_svgs.py

      - name: Commit & push updated SVGs and profile assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update profile analytics & SVGs [skip ci]"
          file_pattern: "assets/* README.md"
