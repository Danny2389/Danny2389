name: Update Profile SVGs

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-svg-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync Latest Main
        run: |
          git fetch origin
          git checkout main
          git reset --hard origin/main

      - name: Generate SVGs
        working-directory: svgs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build_all_svgs.py

      - name: Commit Changes
        run: |
          git add svgs README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "auto: update profile analytics & SVGs [skip ci]"

      - name: Push Changes
        run: |
          git fetch origin

          if ! git rebase origin/main; then
            echo "Rebase conflict. Rebuilding from latest main..."

            git rebase --abort

            git reset --hard origin/main

            cd svgs
            python build_all_svgs.py
            cd ..

            git add svgs README.md

            if git diff --cached --quiet; then
              echo "No changes after rebuild."
              exit 0
            fi

            git commit -m "auto: update profile analytics & SVGs [skip ci]"
          fi

          git push origin HEAD:main
