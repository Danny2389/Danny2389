name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Danny2389
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff003c&color_dots=#161616,#3d0b13,#750d20,#b8092a,#ff003c
            dist/github-contribution-grid-snake-light.svg?palette=github-dark&color_snake=#ff335f&color_dots=#161616,#3d0b13,#750d20,#b8092a,#ff003c

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
