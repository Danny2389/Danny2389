<svg xmlns="http://www.w3.org/2000/svg" width="850" height="280" viewBox="0 0 850 280" fill="none">
  <defs>
    <linearGradient id="langs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429"/>
      <stop offset="50%" stop-color="#ef233c"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>

    <filter id="langs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@700;800&amp;display=swap');

    .header-text { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 800; fill: #4b5563; letter-spacing: 1.5px; }
    .lang-name { font-family: 'Fira Code', monospace; font-size: 11px; fill: #111827; font-weight: 600; }
    .lang-pct { font-family: 'Fira Code', monospace; font-size: 11px; fill: #ff003c; font-weight: 700; }
    .axis-text { font-family: 'Fira Code', monospace; font-size: 9px; fill: #4b5563; }
  </style>

  <rect width="850" height="280" rx="16" fill="url(#langs-bg)" stroke="#d1d5db" stroke-width="1.5"/>

  <g transform="translate(30, 30)">
    <circle cx="6" cy="-4" r="5" fill="#d90429" filter="url(#langs-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="0" class="header-text">GITHUB ANALYTICS &amp; ACTIVITY GRAPH</text>
    <line x1="0" y1="15" x2="790" y2="15" stroke="#d1d5db" stroke-width="1"/>
  </g>

  <g transform="translate(30, 75)">
    <g transform="translate(0, 0)">
      <text class="lang-name">Python / ML / Security</text>
      <text x="290" class="lang-pct" text-anchor="end">98.0%</text>
      <rect y="10" width="290" height="8" rx="4" fill="#f3f4f6"/>
      <rect y="10" width="0" height="8" rx="4" fill="url(#line-grad)">
        <animate attributeName="width" values="0;284.2" dur="1.5s" begin="0.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>
    <g transform="translate(0, 38)">
      <text class="lang-name">HTML & CSS Design</text>
      <text x="290" class="lang-pct" text-anchor="end">1.3%</text>
      <rect y="10" width="290" height="8" rx="4" fill="#f3f4f6"/>
      <rect y="10" width="0" height="8" rx="4" fill="url(#line-grad)">
        <animate attributeName="width" values="0;3.8" dur="1.5s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>
    <g transform="translate(0, 76)">
      <text class="lang-name">JavaScript & Web</text>
      <text x="290" class="lang-pct" text-anchor="end">0.6%</text>
      <rect y="10" width="290" height="8" rx="4" fill="#f3f4f6"/>
      <rect y="10" width="0" height="8" rx="4" fill="url(#line-grad)">
        <animate attributeName="width" values="0;1.7" dur="1.5s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </g>
  </g>

  <line x1="385" y1="75" x2="385" y2="245" stroke="#d1d5db" stroke-width="1"/>

  <g transform="translate(420, 75)">
    <line x1="0" y1="0" x2="390" y2="0" stroke="#e5e7eb" stroke-dasharray="3 3"/>
    <line x1="0" y1="40" x2="390" y2="40" stroke="#e5e7eb" stroke-dasharray="3 3"/>
    <line x1="0" y1="80" x2="390" y2="80" stroke="#e5e7eb" stroke-dasharray="3 3"/>
    <line x1="0" y1="120" x2="390" y2="120" stroke="#e5e7eb" stroke-dasharray="3 3"/>
    <line x1="0" y1="160" x2="390" y2="160" stroke="#d1d5db"/>

    <text x="-8" y="163" text-anchor="end" class="axis-text">0</text>
    <text x="-8" y="123" text-anchor="end" class="axis-text">20</text>
    <text x="-8" y="83" text-anchor="end" class="axis-text">40</text>
    <text x="-8" y="43" text-anchor="end" class="axis-text">60</text>
    <text x="-8" y="3" text-anchor="end" class="axis-text">80</text>

    <text x="10" y="176" text-anchor="middle" class="axis-text">Mon</text>
    <text x="80" y="176" text-anchor="middle" class="axis-text">Tue</text>
    <text x="150" y="176" text-anchor="middle" class="axis-text">Wed</text>
    <text x="220" y="176" text-anchor="middle" class="axis-text">Thu</text>
    <text x="290" y="176" text-anchor="middle" class="axis-text">Fri</text>
    <text x="360" y="176" text-anchor="middle" class="axis-text">Sat/Sun</text>

    <!-- Dynamic Activity Wave Line based on GitHub activity -->
    <path d="M 10 140 Q 45 60 80 100 T 150 70 T 220 120 T 290 40 T 360 90" fill="none" stroke="url(#line-grad)" stroke-width="3" filter="url(#langs-glow)"/>
    <path d="M 10 140 Q 45 60 80 100 T 150 70 T 220 120 T 290 40 T 360 90 L 360 160 L 10 160 Z" fill="url(#line-grad)" opacity="0.12"/>
  </g>
</svg>