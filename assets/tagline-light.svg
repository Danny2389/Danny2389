<svg xmlns="http://www.w3.org/2000/svg" width="850" height="125" viewBox="0 0 850 125" fill="none">
  <defs>
    <linearGradient id="tagline-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="tagline-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&amp;family=Inter:wght@600;700;800;900&amp;display=swap');
    .role-header { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 800; fill: #d90429; letter-spacing: 0.5px; }
    .tag-sub { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; fill: #4b5563; opacity: 0.95; }
    .slogan-pill { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #ff003c; letter-spacing: 1px; }
  </style>

  <rect width="850" height="125" rx="14" fill="url(#tagline-bg)" stroke="#d1d5db" stroke-width="1.2"/>

  <text x="425" y="32" text-anchor="middle" class="role-header" filter="url(#tagline-glow)">
    Cyber Security Analyst  •  VAPT Specialist  •  Python Automation Developer
  </text>

  <text x="425" y="58" text-anchor="middle" class="tag-sub">
    Passionate about discovering vulnerabilities, securing digital infrastructure, and engineering automated Python security tools.
  </text>
  <text x="425" y="76" text-anchor="middle" class="tag-sub">
    Experienced in web application penetration testing, network security hardening and REST API auditing.
  </text>

  <g transform="translate(185, 90)">
    <rect x="0" y="0" width="480" height="22" rx="11" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="240" y="15" text-anchor="middle" class="slogan-pill">ALWAYS LEARNING  •  ALWAYS SECURING  •  ALWAYS BUILDING</text>
  </g>
</svg>