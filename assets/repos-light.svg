    .r-title { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 800; fill: #111827; }
    .r-chip { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 600; fill: #111827; }
    .r-domain { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; }
    .r-desc { font-family: 'Inter', sans-serif; font-size: 11px; fill: #4b5563; opacity: 0.95; }
  </style>

